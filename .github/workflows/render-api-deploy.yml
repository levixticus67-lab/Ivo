name: Deploy Render image API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render API deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify API deploy hook is configured
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_API_DEPLOY_HOOK_URL" ]; then
            echo "Add the RENDER_API_DEPLOY_HOOK_URL repository secret before running this workflow." >&2
            exit 1
          fi
      - name: Trigger Render API deploy hook
        env:
          RENDER_API_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_API_DEPLOY_HOOK_URL"
